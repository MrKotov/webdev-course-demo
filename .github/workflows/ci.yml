# Runs the tests on every push and pull request. If this is red, nothing gets deployed.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tests
        run: npm test

      - name: The MCP server from Exercise 1 still answers correctly
        run: node mcp-server/check.mjs -- node mcp-server/server.js

      - name: The image builds
        run: docker build -t lab-booking:ci .

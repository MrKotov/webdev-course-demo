# Deploying on Render: one web service, built from the Dockerfile.
# Migrations run at boot, so a deploy is a push and nothing else.
services:
  - type: web
    name: lab-booking
    runtime: docker
    plan: free
    healthCheckPath: /api/slots
    envVars:
      - key: PORT
        value: 3000
      # The free plan has no disk, so the SQLite file is lost on every restart.
      # That is fine for the demo; the moment it is not, this becomes the Neon URL
      # and src/db.js grows a Postgres branch.
      - key: DATABASE_URL
        value: sqlite:/app/data/lab-booking.db
      - key: SESSION_SECRET
        generateValue: true
      # Render fills this in with the service's own URL, which is what Google must
      # have on its list of redirect URIs.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: lab-booking
          property: hostport
      # sync: false means "ask me in the dashboard". The value is never in this file
      # and never in git, which matters more than usual here: the repository is public.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
